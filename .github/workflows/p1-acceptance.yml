name: P1 acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      P1_ACCEPTANCE_PLATFORM: linux_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare evidence directory
        run: mkdir -p .artifacts
      - name: Test without opt-in PostgreSQL
        run: python -m pytest -m "not postgresql" --junitxml=.artifacts/non-postgresql.xml
      - name: Start PostgreSQL contract environment
        run: docker compose -f compose.test.yaml up --build --detach postgres
      - name: Migrate PostgreSQL contract environment
        run: docker compose -f compose.test.yaml run --rm migration
      - name: PostgreSQL provider contract
        env:
          TEST_DATABASE_URL: postgresql+psycopg://stock_test:stock_test_local_only@127.0.0.1:55432/stock_forecasting_test
        run: python -m pytest -m postgresql -q --junitxml=.artifacts/postgresql.xml
      - name: Digest contract reports
        run: cd .artifacts && sha256sum non-postgresql.xml postgresql.xml > contract-reports.sha256
      - name: Type check
        run: python -m mypy src tests
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run deployed P1 acceptance
        run: docker compose --profile acceptance run --build --rm acceptance
      - name: Verify exported acceptance bundle
        if: always()
        run: cd .artifacts && sha256sum --check contract-reports.sha256 && sha256sum --check p1-acceptance-bundle.json.sha256 && sha256sum --check p1-evidence-objects.sha256
      - name: Preserve immutable P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-linux-acceptance-evidence
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Clean acceptance state
        if: always()
        run: docker compose --profile acceptance down --volumes --remove-orphans
      - name: Clean PostgreSQL contract state
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
