name: P1 acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Type check
        run: python -m mypy src tests
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run deployed P1 acceptance
        run: docker compose --profile acceptance run --build --rm acceptance
      - name: Clean acceptance state
        if: always()
        run: docker compose --profile acceptance down --volumes --remove-orphans
