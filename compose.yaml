name: stock-forecasting-ticket-05

x-fixture-information-cutoff: &fixture-information-cutoff '2026-08-12T22:00:00Z'
x-fixture-collection-observed-at: &fixture-collection-observed-at '2026-08-12T21:55:00Z'

x-application-environment: &application-environment
  DATABASE_URL: postgresql+psycopg://stock@postgres:5432/stock_forecasting
  OBJECT_ROOT: /var/lib/stock-forecasting/objects
  FIXTURE_INFORMATION_CUTOFF: *fixture-information-cutoff
  FIXTURE_COLLECTION_OBSERVED_AT: *fixture-collection-observed-at
  DAGSTER_HOME: /var/lib/dagster
  RUNTIME_ENVIRONMENT: development
  PUBLIC_BIND_HOST: 127.0.0.1
  LOCAL_API_KEY_MODE: enabled
  LOCAL_API_KEY_FILE: /run/stock-forecasting/local-api-key.json
  PLATFORM_ADMIN_API_KEY_FILE: /run/stock-forecasting/platform-admin-api-key.json
  AUTHORIZATION_POLICY_SET_ID: fixture-active-v1
  P1_ACCEPTANCE_PLATFORM: ${P1_ACCEPTANCE_PLATFORM:-windows_docker_desktop}
  P1_OCI_IMAGE_DIGEST: ${P1_OCI_IMAGE_DIGEST:-}
  P1_OCI_IMAGE_DIGEST_FILE: /run/stock-forecasting/image-provenance/oci-image-id
  P1_ACCEPTANCE_EXPORT_DIR: /var/lib/stock-forecasting/exports
  P1_COUNTERPART_BUNDLE: ${P1_COUNTERPART_BUNDLE:-}

x-application: &application
  image: stock-forecasting-ticket-05-app:0.1.0
  environment: *application-environment
  volumes:
    - fixture-objects:/var/lib/stock-forecasting/objects
    - dagster-home:/var/lib/dagster
    - local-api-key:/run/stock-forecasting

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stock_forecasting
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:15435:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_forecasting"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migration:
    <<: *application
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/stock_forecasting
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  local-key-init:
    <<: *application
    command:
      - python
      - -m
      - stock_forecasting.cli
      - local-key
      - init
      - --path
      - /run/stock-forecasting/local-api-key.json
      - --owner
      - local-researcher
      - --environment
      - development
      - --scope
      - fixture_pipeline.execute
      - --scope
      - research_prediction.read

  authorization-init:
    <<: *application
    command:
      - python
      - -m
      - stock_forecasting.cli
      - authorization
      - init-fixtures
      - --database-url
      - postgresql+psycopg://postgres@postgres:5432/stock_forecasting
      - --key-file
      - /run/stock-forecasting/local-api-key.json
      - --platform-admin-key-file
      - /run/stock-forecasting/platform-admin-api-key.json
    depends_on:
      migration:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully

  database-grants:
    image: postgres:17-alpine
    command:
      - psql
      - --host
      - postgres
      - --username
      - postgres
      - --dbname
      - stock_forecasting
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /opt/stock-forecasting/grant-application-role.sql
    volumes:
      - ./docker/postgres/grant-application-role.sql:/opt/stock-forecasting/grant-application-role.sql:ro
    depends_on:
      authorization-init:
        condition: service_completed_successfully

  denied-api:
    <<: *application
    profiles: ["acceptance"]
    environment:
      <<: *application-environment
      AUTHORIZATION_POLICY_SET_ID: fixture-revoked-v1
    command: ["uvicorn", "stock_forecasting.asgi:app", "--host", "127.0.0.1", "--port", "8001"]
    depends_on:
      migration:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  denied-api-ingress:
    image: nginx:1.29.1-alpine
    profiles: ["acceptance"]
    network_mode: service:denied-api
    volumes:
      - ./docker/nginx/denied-api-loopback.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      denied-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/livez"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *application
    build:
      context: .
      args:
        SOURCE_DATE_EPOCH: "0"
    command: ["uvicorn", "stock_forecasting.asgi:app", "--host", "127.0.0.1", "--port", "8000"]
    ports:
      - '127.0.0.1:18005:8080'
    depends_on:
      migration:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  api-ingress:
    image: nginx:1.29.1-alpine
    network_mode: service:api
    volumes:
      - ./docker/nginx/api-loopback.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/livez"]
      interval: 2s
      timeout: 3s
      retries: 30

  dagster-init:
    <<: *application
    command: ["dagster", "instance", "migrate"]
    depends_on:
      migration:
        condition: service_completed_successfully

  dagster-code:
    <<: *application
    command:
      - dagster
      - api
      - grpc
      - -m
      - stock_forecasting.dagster_definitions
      - -h
      - 0.0.0.0
      - -p
      - '4000'
    depends_on:
      migration:
        condition: service_completed_successfully
      dagster-init:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "127.0.0.1", "-p", "4000"]
      interval: 2s
      timeout: 3s
      retries: 30

  denied-dagster-code:
    <<: *application
    environment:
      <<: *application-environment
      AUTHORIZATION_POLICY_SET_ID: fixture-revoked-v1
      AUTHORIZATION_ACCEPTANCE_MODE: denied
    command:
      - dagster
      - api
      - grpc
      - -m
      - stock_forecasting.dagster_definitions
      - -h
      - 0.0.0.0
      - -p
      - '4000'
    depends_on:
      migration:
        condition: service_completed_successfully
      dagster-init:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "127.0.0.1", "-p", "4000"]
      interval: 2s
      timeout: 3s
      retries: 30

  dagster-webserver:
    <<: *application
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "dagster-workspace.yaml"]
    ports:
      - '127.0.0.1:13005:3000'
    depends_on:
      dagster-code:
        condition: service_healthy
      denied-dagster-code:
        condition: service_healthy
      dagster-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - stock_forecasting.dagster_deployment
        - --url
        - http://127.0.0.1:3000/graphql
        - --require
        - workspace
      interval: 2s
      timeout: 3s
      retries: 30

  dagster-daemon:
    <<: *application
    command: ["dagster-daemon", "run", "-w", "dagster-workspace.yaml"]
    depends_on:
      dagster-code:
        condition: service_healthy
      denied-dagster-code:
        condition: service_healthy
      dagster-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - stock_forecasting.dagster_deployment
        - --url
        - http://dagster-webserver:3000/graphql
        - --require
        - daemons
      interval: 2s
      timeout: 3s
      retries: 30

  outbox-relay:
    <<: *application
    profiles: ["relay"]
    command: ["python", "-m", "stock_forecasting.cli", "relay", "--once"]
    depends_on:
      migration:
        condition: service_completed_successfully
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully

  evidence-init:
    image: alpine:3.22.1
    profiles: ["acceptance"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mkdir -p /evidence && chmod 0777 /evidence
    volumes:
      - ./.artifacts:/evidence

  image-provenance:
    image: docker:28.5.2-cli
    profiles: ["acceptance"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        container_id="$$(docker ps --filter label=com.docker.compose.project=stock-forecasting-ticket-05 --filter label=com.docker.compose.service=api --format '{{.ID}}' | head -n 1)"
        test -n "$$container_id"
        docker inspect "$$container_id" --format '{{.Image}}' > /evidence/oci-image-id.tmp
        test -s /evidence/oci-image-id.tmp
        mv /evidence/oci-image-id.tmp /evidence/oci-image-id
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - image-provenance:/evidence
    depends_on:
      api:
        condition: service_healthy

  acceptance:
    <<: *application
    profiles: ["acceptance"]
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects
      - dagster-home:/var/lib/dagster
      - local-api-key:/run/stock-forecasting
      - ./.git:/workspace/.git:ro
      - ./.artifacts:/var/lib/stock-forecasting/exports
      - image-provenance:/run/stock-forecasting/image-provenance:ro
    command:
      - python
      - -m
      - stock_forecasting.cli
      - acceptance
      - ticket-05
      - --database-url
      - postgresql+psycopg://stock@postgres:5432/stock_forecasting
      - --object-root
      - /var/lib/stock-forecasting/objects
      - --information-cutoff
      - *fixture-information-cutoff
      - --observed-at
      - *fixture-collection-observed-at
      - --base-url
      - http://api:8080
      - --dagster-url
      - http://dagster-webserver:3000/graphql
      - --denied-base-url
      - http://denied-api:8081
      - --project-root
      - /app
      - --git-dir
      - /workspace/.git
    depends_on:
      evidence-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      api-ingress:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
      denied-dagster-code:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy
      dagster-daemon:
        condition: service_healthy
      local-key-init:
        condition: service_completed_successfully
      authorization-init:
        condition: service_completed_successfully
      database-grants:
        condition: service_completed_successfully
      denied-api:
        condition: service_healthy
      denied-api-ingress:
        condition: service_healthy
      image-provenance:
        condition: service_completed_successfully

  ticket-06-local-key-init:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects
      - dagster-home:/var/lib/dagster
      - ticket-06-local-key:/run/stock-forecasting
    command:
      - python
      - -m
      - stock_forecasting.cli
      - local-key
      - init
      - --path
      - /run/stock-forecasting/local-api-key.json
      - --owner
      - ticket-06-researcher
      - --environment
      - development
      - --scope
      - price_research_eligibility.read
      - --scope
      - source_credential.read
      - --scope
      - source_credential.manage
      - --data-protection-class
      - licensed
      - --data-protection-class
      - restricted
      - --data-protection-class
      - secret
      - --principal-classification
      - individual_or_internal_group

  ticket-06-source-adapter-key-init:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    volumes:
      - ticket-06-source-adapter-key:/run/stock-forecasting-source-adapter
    command:
      - python
      - -m
      - stock_forecasting.cli
      - local-key
      - init
      - --path
      - /run/stock-forecasting-source-adapter/local-api-key.json
      - --owner
      - ticket-06-finmind-source-adapter
      - --environment
      - development
      - --scope
      - market_data.collect
      - --data-protection-class
      - licensed
      - --data-protection-class
      - secret
      - --principal-classification
      - individual_or_internal_group

  ticket-06-authorization-init:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects
      - dagster-home:/var/lib/dagster
      - ticket-06-local-key:/run/stock-forecasting
      - ticket-06-source-adapter-key:/run/stock-forecasting-source-adapter:ro
    command:
      - python
      - -m
      - stock_forecasting.cli
      - authorization
      - init-ticket-06
      - --database-url
      - postgresql+psycopg://postgres@postgres:5432/stock_forecasting
      - --key-file
      - /run/stock-forecasting/local-api-key.json
      - --source-adapter-key-file
      - /run/stock-forecasting-source-adapter/local-api-key.json
    depends_on:
      database-grants:
        condition: service_completed_successfully
      ticket-06-local-key-init:
        condition: service_completed_successfully
      ticket-06-source-adapter-key-init:
        condition: service_completed_successfully

  ticket-06-api:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    build:
      context: .
      args:
        SOURCE_DATE_EPOCH: "0"
    environment:
      <<: *application-environment
      LOCAL_API_KEY_FILE: /run/stock-forecasting/local-api-key.json
      AUTHORIZATION_POLICY_SET_ID: ticket-06-finmind-zero-fee-engineering-v1
      SOURCE_SECRET_ROOT: /var/lib/stock-forecasting/source-secrets
      SOURCE_ADAPTER_API_KEY_FILE: /run/stock-forecasting-source-adapter/local-api-key.json
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects
      - dagster-home:/var/lib/dagster
      - ticket-06-local-key:/run/stock-forecasting
      - ticket-06-source-adapter-key:/run/stock-forecasting-source-adapter:ro
      - ticket-06-source-secrets:/var/lib/stock-forecasting/source-secrets
    command: ["uvicorn", "stock_forecasting.asgi:app", "--host", "127.0.0.1", "--port", "8000"]
    depends_on:
      ticket-06-authorization-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30

  ticket-06-api-ingress:
    image: nginx:1.29.1-alpine
    profiles: ["ticket-06-acceptance"]
    network_mode: service:ticket-06-api
    volumes:
      - ./docker/nginx/api-loopback.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ticket-06-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/livez"]
      interval: 2s
      timeout: 3s
      retries: 30

  ticket-06-source-probe:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    environment:
      <<: *application-environment
      AUTHORIZATION_POLICY_SET_ID: ticket-06-finmind-zero-fee-engineering-v1
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects:ro
      - ticket-06-source-adapter-key:/run/stock-forecasting-source-adapter:ro
      - ticket-06-source-secrets:/var/lib/stock-forecasting/source-secrets:ro
    command:
      - python
      - -m
      - stock_forecasting.cli
      - acceptance
      - ticket-06-source-probe
      - --database-url
      - postgresql+psycopg://stock@postgres:5432/stock_forecasting
      - --object-root
      - /var/lib/stock-forecasting/objects
      - --information-cutoff
      - *fixture-information-cutoff
      - --observed-at
      - *fixture-collection-observed-at
      - --source-adapter-key-file
      - /run/stock-forecasting-source-adapter/local-api-key.json
      - --source-secret-root
      - /var/lib/stock-forecasting/source-secrets
    depends_on:
      database-grants:
        condition: service_completed_successfully
      ticket-06-authorization-init:
        condition: service_completed_successfully
      ticket-06-api:
        condition: service_healthy

  ticket-06-acceptance:
    <<: *application
    profiles: ["ticket-06-acceptance"]
    environment:
      <<: *application-environment
      LOCAL_API_KEY_FILE: /run/stock-forecasting/local-api-key.json
      AUTHORIZATION_POLICY_SET_ID: ticket-06-finmind-zero-fee-engineering-v1
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects:ro
      - ticket-06-local-key:/run/stock-forecasting:ro
    command:
      - python
      - -m
      - stock_forecasting.cli
      - acceptance
      - ticket-06
      - --database-url
      - postgresql+psycopg://stock@postgres:5432/stock_forecasting
      - --object-root
      - /var/lib/stock-forecasting/objects
      - --information-cutoff
      - *fixture-information-cutoff
      - --observed-at
      - *fixture-collection-observed-at
      - --base-url
      - http://ticket-06-api:8080
      - --key-file
      - /run/stock-forecasting/local-api-key.json
    depends_on:
      ticket-06-api:
        condition: service_healthy
      ticket-06-api-ingress:
        condition: service_healthy
      database-grants:
        condition: service_completed_successfully
      ticket-06-authorization-init:
        condition: service_completed_successfully
      ticket-06-source-probe:
        condition: service_completed_successfully

  ticket-07-local-key-init:
    <<: *application
    profiles: ["ticket-07-acceptance"]
    volumes:
      - fixture-objects:/var/lib/stock-forecasting/objects
      - dagster-home:/var/lib/dagster
      - ticket-07-local-key:/run/stock-forecasting
    command:
      - python
      - -m
      - stock_forecasting.cli
      - local-key
      - init
      - --path
      - /run/stock-forecasting/local-api-key.json
      - --owner
      - ticket-07-source-administrator
      - --environment
      - development
      - --scope
      - price_research_eligibility.read
      - --scope
      - source_credential.read
      - --scope
      - source_credential.manage
      - --data-protection-class
      - licensed
      - --data-protection-class
      - restricted
      - --data-protection-class
      - secret
      - --principal-classification
      - individual_non_commercial

  ticket-07-source-adapter-key-init:
