            candidate_id: {type: string}
            artifact_id: {type: string}
            evaluation_report_id: {type: string}
            policy_version_id: {type: string}
            approval_policy_version_id: {type: string}
            approval_mode: {type: string, enum: [separated_duties, owner_operated]}
            approval_policy_owner_principal_id: {type: [string, 'null']}
            independent_review: {type: boolean}
            approver_id: {type: string}
            decision: {type: string, enum: [approved, rejected]}
            reason: {type: string}
            expected_assignment: {type: string}
            expires_at: {type: string, format: date-time}
            invalidated_reason: {type: [string, 'null']}
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, trace_id, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        code: {type: string}
