        artifact_id: {type: string, minLength: 1, maxLength: 128}
        evaluation_report_id: {type: string, minLength: 1, maxLength: 128}
        policy_version_id: {type: string, minLength: 1, maxLength: 128}
        decision: {type: string, enum: [approved, rejected]}
        reason: {type: string, minLength: 1, maxLength: 1000}
        expected_assignment: {type: string, minLength: 1, maxLength: 256}
