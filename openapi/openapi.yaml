openapi: 3.2.0
info:
  title: 台美個股趨勢研究 REST
  version: 1.0.0
  description: Fixture results are engineering evidence and are never formal predictions.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/research/predictions:
    get:
      operationId: listPredictionMatrix
      security:
        - LocalApiKey: []
      parameters:
        - $ref: '#/components/parameters/InformationCutoff'
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Snapshot-bound prediction matrix.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionMatrix'
        '304':
          description: The snapshot representation is unchanged.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/research/listings/{listing_id}:
    get:
      operationId: getListingResearch
      security:
        - LocalApiKey: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/InformationCutoff'
      responses:
        '200':
          description: Research projection for one immutable listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResearch'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/research/listings/{listing_id}/price-eligibility:
    get:
      operationId: getListingPriceResearchEligibility
      security:
        - LocalApiKey: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Taiwan and United States price-source research eligibility and immutable lineage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResearchEligibility'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/operations/sources:
    get:
      operationId: listPriceSourceEligibility
      security:
        - LocalApiKey: []
      responses:
        '200':
          description: Current operational projection of Taiwan and United States price-source eligibility.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PriceSourceEligibility'}
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/operations/source-credentials:
    get:
      operationId: listSourceCredentials
      security:
        - LocalApiKey: []
      responses:
        '200':
          description: Write-only provider credential readiness metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SourceCredentialMetadata'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/operations/source-credentials/{provider_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    put:
      operationId: setSourceCredential
      security:
        - LocalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCredentialWriteRequest'}
      responses:
        '200':
          description: Credential metadata after storing the write-only value.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredentialMetadata'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '413': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
    delete:
      operationId: revokeSourceCredential
      security:
        - LocalApiKey: []
      responses:
        '200':
          description: Revoked credential metadata; the secret value is destroyed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredentialMetadata'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/operations/source-credentials/{provider_id}/rotations:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      operationId: rotateSourceCredential
      security:
        - LocalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCredentialWriteRequest'}
      responses:
        '200':
          description: Credential metadata after atomically replacing the secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredentialMetadata'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '413': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/operations/source-credentials/{provider_id}/validations:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      operationId: validateSourceCredential
      security:
        - LocalApiKey: []
      responses:
        '200':
          description: Provider API validation result without secret material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceCredentialValidationResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/research/model-families/{model_family_id}/backtests:
    get:
      operationId: getModelGovernanceBacktest
      security:
        - LocalApiKey: []
      parameters:
        - name: model_family_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Immutable candidate, baseline, calibration, support, gate, approval and shadow evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelGovernanceBacktest'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '404': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/governance/approval-decisions:
    post:
      operationId: decideModelApproval
      security:
        - LocalApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: If-Match
          in: header
          required: true
          description: Quoted expected lifecycle aggregate version.
          schema: {type: string, pattern: '^"[0-9]+"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '201':
          description: Immutable approval or rejection decision bound to exact evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalDecisionResponse'}
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}
        '409': {$ref: '#/components/responses/ProblemResponse'}
        '413': {$ref: '#/components/responses/ProblemResponse'}
        '422': {$ref: '#/components/responses/ProblemResponse'}
  /api/v1/operations/health:
    get:
      operationId: listCanonicalHealth
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Canonical source-health assessments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/HealthAssessment'}
components:
  securitySchemes:
    LocalApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Loopback local/development ApiKey credential.
  parameters:
    InformationCutoff:
      name: information_cutoff
      in: query
      required: true
      schema:
        type: string
        format: date-time
      example: '2026-08-12T07:00:00Z'
    ListingId:
      name: listing_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        enum: [alpaca-market-data-basic, finmind-free-api]
  responses:
    ProblemResponse:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    NamedProbabilities:
      type: object
      additionalProperties: false
      required: [up, flat, down]
      properties:
        up: {type: number, minimum: 0, maximum: 1}
        flat: {type: number, minimum: 0, maximum: 1}
        down: {type: number, minimum: 0, maximum: 1}
    AvailablePrediction:
      type: object
      additionalProperties: false
      required:
        - horizon_sessions
        - probabilities
        - confidence_score
        - prediction_status
        - data_support
      properties:
        horizon_sessions: {type: integer, enum: [1, 5, 20]}
        probabilities: {$ref: '#/components/schemas/NamedProbabilities'}
        confidence_score: {type: number, minimum: 0, maximum: 1}
        prediction_status: {type: string, enum: [full, degraded]}
        data_support: {$ref: '#/components/schemas/DataSupport'}
    UnavailablePrediction:
      type: object
      additionalProperties: false
      required:
        - horizon_sessions
        - prediction_status
        - unavailable_reason
        - data_support
      properties:
        horizon_sessions: {type: integer, enum: [1, 5, 20]}
        prediction_status: {type: string, const: unavailable}
        unavailable_reason:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum:
                - missing_anchor_price
                - post_cutoff_evidence
                - source_withdrawn
                - missing_company_action
                - calendar_unresolved
        data_support: {$ref: '#/components/schemas/DataSupport'}
    PredictionResult:
      oneOf:
        - $ref: '#/components/schemas/AvailablePrediction'
        - $ref: '#/components/schemas/UnavailablePrediction'
    DataSupport:
      type: object
      additionalProperties: false
      required: [price_volume]
      properties:
        price_volume: {type: string, enum: [full, degraded, unavailable]}
    MatrixItem:
      type: object
      required:
        [listing_id, display_ticker, market, fixture_badge, predictions, lineage, projection]
      properties:
        listing_id: {type: string, format: uuid}
        display_ticker: {type: string}
        market: {type: string, enum: [XTAI, XNAS]}
        fixture_badge: {type: string, const: Fixture／非正式預測}
        predictions:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/PredictionResult'}
        lineage: {$ref: '#/components/schemas/Lineage'}
        projection: {$ref: '#/components/schemas/ProjectionStatus'}
    PredictionMatrix:
      type: object
      required: [information_cutoff, execution_purpose, phase_boundaries, items]
      properties:
        information_cutoff: {type: string, format: date-time}
        execution_purpose: {type: string, const: fixture}
        phase_boundaries:
          type: object
          additionalProperties: false
          required: [documents, fundamentals, macro]
          properties:
            documents: {$ref: '#/components/schemas/UnavailablePhaseModality'}
            fundamentals: {$ref: '#/components/schemas/UnavailablePhaseModality'}
            macro: {$ref: '#/components/schemas/UnavailablePhaseModality'}
        items:
          type: array
          items: {$ref: '#/components/schemas/MatrixItem'}
    UnavailablePhaseModality:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: {type: string, const: unavailable}
        reason: {type: string, const: phase_1_optional_modality_out_of_scope}
    ListingResearch:
      type: object
      required:
        - identity
        - calendar
        - information_cutoff
        - execution_purpose
        - fixture_badge
        - predictions
        - lineage
        - source_evidence
        - projection
      properties:
        identity: {type: object}
        calendar: {type: object}
        information_cutoff: {type: string, format: date-time}
        execution_purpose: {type: string, const: fixture}
        fixture_badge: {type: string, const: Fixture／非正式預測}
        predictions:
          type: array
          items: {$ref: '#/components/schemas/PredictionResult'}
        lineage: {$ref: '#/components/schemas/Lineage'}
        source_evidence: {type: object}
        projection: {$ref: '#/components/schemas/ProjectionStatus'}
    ProjectionStatus:
      type: object
      additionalProperties: false
      required:
        - core_projection_version
        - evidence_projection_version
        - stale
      properties:
        core_projection_version: {type: integer, minimum: 0}
        evidence_projection_version: {type: integer, minimum: 0}
        stale: {type: boolean}
    OpenDataSourceBasis:
      type: object
      additionalProperties: false
      required:
        - source_basis_id
        - basis_type
        - license_id
        - terms_url
        - attribution
        - account_required
        - application_required
        - fee_required
        - history_strategy
        - qualification_status
        - datasets
      properties:
        source_basis_id: {type: string, const: TWSE-OGDL-OPEN-DATA-01}
        basis_type: {type: string, const: open_data_terms}
        license_id: {type: string, const: OGDL-1.0}
        terms_url: {type: string, format: uri}
        attribution: {type: string, minLength: 1}
        account_required: {type: boolean, const: false}
        application_required: {type: boolean, const: false}
        fee_required: {type: boolean, const: false}
        history_strategy:
          type: string
          const: prospective_platform_observation
        qualification_status:
          type: string
          const: documented_not_archived
        datasets:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [dataset_id, dataset_url, distribution_url, qualification_scope]
            properties:
              dataset_id: {type: string}
              dataset_url: {type: string, format: uri}
              distribution_url: {type: string, format: uri}
              qualification_scope:
                type: string
                enum:
                  - current_eod
                  - current_corporate_action
                  - current_dividend
                  - current_listing_reference
                  - selection_support
    ZeroFeeSourceBundleMember:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - dataset_id
        - distribution_url
        - qualification_scope
        - schema_version
        - price_semantics
        - qualification_status
        - materialization_role
        - known_gaps
        - allowed_uses
        - rights_status
        - attribution_requirement
        - retention_limit
        - deletion_requirement
        - effective_from
        - effective_to
      properties:
        provider_id: {type: string, minLength: 1}
        dataset_id: {type: string, minLength: 1}
        distribution_url: {type: string, format: uri}
        qualification_scope: {type: string, minLength: 1}
        schema_version: {type: string, minLength: 1}
        price_semantics:
          type: [string, 'null']
          enum: [unadjusted, null]
        qualification_status:
          type: string
          enum: [candidate_terms_not_archived, candidate_scope_limited]
        materialization_role:
          type: string
          enum: [required_observation, supplemental_qualification_reference]
        known_gaps:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        allowed_uses:
          type: array
          items:
            type: string
            enum: [ingest, retain_observed_history, transform, model, internal_display, backup_restore]
        rights_status: {type: string, const: unverified}
        attribution_requirement: {type: string, const: unresolved}
        retention_limit: {type: string, const: unresolved}
        deletion_requirement: {type: string, const: unresolved}
        effective_from: {type: [string, 'null'], format: date}
        effective_to: {type: [string, 'null'], format: date}
    ZeroFeeAuthenticatedSourceBasis:
      type: object
      additionalProperties: false
      required:
        - source_basis_id
        - basis_type
        - provider_id
        - plan_id
        - principal_classification
        - credential_kind
        - account_required
        - fee_required
        - terms_url
        - terms_content_sha256
        - qualification_status
        - members
        - supplemental_references
      properties:
        source_basis_id: {type: string, minLength: 1}
        basis_type: {type: string, const: zero_fee_plan}
        provider_id: {type: string, minLength: 1}
        plan_id: {type: string, minLength: 1}
        principal_classification: {type: string, minLength: 1}
        credential_kind: {type: string, enum: [api_key_pair, bearer_token]}
        account_required: {type: boolean, const: true}
        fee_required: {type: boolean, const: false}
        terms_url: {type: string, format: uri}
        terms_content_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        qualification_status:
          type: string
          const: candidate_terms_not_archived
        members:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ZeroFeeSourceBundleMember'}
        supplemental_references:
          type: array
          items: {$ref: '#/components/schemas/ZeroFeeSourceBundleMember'}
    PriceResearchEligibility:
      type: object
      additionalProperties: false
      required:
        - listing_id
        - market
        - status
        - reason_code
        - source_basis_id
        - source_basis
        - formally_qualified
        - downstream_readiness
        - checks
        - sources
      properties:
        listing_id: {type: string, format: uuid}
        market: {type: string, enum: [XTAI, XNAS, XNYS]}
        status:
          type: string
          enum: [qualified, credential_required, policy_blocked, quarantined, deferred, unavailable]
        reason_code: {type: string}
        source_basis_id: {type: string, minLength: 1}
        source_basis:
          oneOf:
            - {$ref: '#/components/schemas/OpenDataSourceBasis'}
            - {$ref: '#/components/schemas/ZeroFeeAuthenticatedSourceBasis'}
        formally_qualified: {type: boolean}
        downstream_readiness:
          $ref: '#/components/schemas/PriceDownstreamReadiness'
        checks:
          $ref: '#/components/schemas/PriceQualificationChecks'
        sources:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PriceSourceEligibility'}
    PriceDownstreamReadiness:
      type: object
      additionalProperties: false
      required: [new_collection, feature_materialization, training, research_display]
      properties:
        new_collection: {$ref: '#/components/schemas/PriceDownstreamState'}
        feature_materialization: {$ref: '#/components/schemas/PriceDownstreamState'}
        training: {$ref: '#/components/schemas/PriceDownstreamState'}
        research_display: {$ref: '#/components/schemas/PriceDownstreamState'}
    PriceDownstreamState:
      type: string
      enum: [ready, credential_required, policy_blocked, quarantined, deferred, unavailable]
    PriceQualificationChecks:
      type: object
      additionalProperties: false
      required: [policy, coverage, schema, integrity, depth]
      properties:
        policy: {type: string, enum: [passed, blocked]}
        coverage: {type: string, enum: [passed, blocked, not_evaluated]}
        schema: {type: string, enum: [passed, blocked, not_evaluated]}
        integrity: {type: string, enum: [passed, blocked, not_evaluated]}
        depth: {type: string, enum: [passed, blocked, not_evaluated]}
    CurrentSourcePolicyDecision:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - decision_id
        - outcome
        - reason_code
        - subject_principal_id
        - runtime_environment
        - subject_attributes_evidence_id
        - subject_attributes_valid_until
        - subject_data_protection_classes
        - subject_principal_classification
        - dataset_id
        - prior_evaluation_id
        - prior_decision_id
        - prior_trace_id
        - prior_correlation_id
        - evaluated_at
        - valid_until
        - grant_version_id
        - source_policy_version_id
        - source_entitlement_version_id
        - evidence_artifact_id
      properties:
        evaluation_id: {type: string, format: uuid}
        decision_id: {type: string, format: uuid}
        outcome: {type: string, enum: [allowed, denied]}
        reason_code: {type: string}
        subject_principal_id: {type: [string, 'null'], format: uuid}
        runtime_environment:
          type: string
          enum: [local, development, test, staging, production]
        subject_attributes_evidence_id: {type: [string, 'null']}
        subject_attributes_valid_until: {type: [string, 'null'], format: date-time}
        subject_data_protection_classes:
          type: [array, 'null']
          items:
            type: string
            enum: [public_source, internal, licensed, restricted, secret]
        subject_principal_classification: {type: [string, 'null']}
        dataset_id: {type: string}
        prior_evaluation_id: {type: string, format: uuid}
        prior_decision_id: {type: [string, 'null'], format: uuid}
        prior_trace_id: {type: [string, 'null']}
        prior_correlation_id: {type: [string, 'null']}
        evaluated_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        grant_version_id: {type: [string, 'null']}
        source_policy_version_id: {type: [string, 'null']}
        source_entitlement_version_id: {type: [string, 'null']}
        evidence_artifact_id: {type: string}
    PriceSourceEligibility:
      type: object
      additionalProperties: false
      required:
        - status
        - reason_code
        - policy_reason_code
        - source_basis_id
        - source_id
        - source_mode
        - listing_ids
        - trace_id
        - policy_decision_id
        - policy_evaluation_id
        - policy_correlation_id
        - policy_valid_until
        - evaluated_at
        - raw_object_id
        - retrieval_receipt_id
        - normalized_object_id
        - source_revision
        - checkpoint
        - coverage
        - dataset_version_id
        - adjustment_version_id
        - historical_availability_claim_id
        - rate_limit_policy_id
        - retry_after_seconds
        - checks
        - current_policy_decision
      properties:
        status:
          type: string
          enum: [published, credential_required, policy_blocked, quarantined, deferred, unavailable]
        reason_code: {type: string}
        policy_reason_code: {type: string}
        source_basis_id: {type: string, minLength: 1}
        source_id: {type: string}
        source_mode: {type: string, enum: [current, historical]}
        listing_ids:
          type: array
          items: {type: string, format: uuid}
        trace_id: {type: string}
        policy_decision_id: {type: string, format: uuid}
        policy_evaluation_id: {type: string, format: uuid}
        policy_correlation_id: {type: string}
        policy_valid_until: {type: string, format: date-time}
        evaluated_at: {type: string, format: date-time}
        raw_object_id:
          type: [string, 'null']
        retrieval_receipt_id:
          type: [string, 'null']
        normalized_object_id:
          type: [string, 'null']
        source_revision:
          type: [string, 'null']
        checkpoint:
          type: [string, 'null']
        coverage:
          oneOf:
            - $ref: '#/components/schemas/SourceCollectionCoverage'
            - {type: 'null'}
        dataset_version_id:
          type: [string, 'null']
        adjustment_version_id:
          type: [string, 'null']
        historical_availability_claim_id:
          type: [string, 'null']
        rate_limit_policy_id:
          type: [string, 'null']
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
        current_policy_decision:
          oneOf:
            - $ref: '#/components/schemas/CurrentSourcePolicyDecision'
            - {type: 'null'}
        checks:
          $ref: '#/components/schemas/PriceQualificationChecks'
    SourceCollectionCoverage:
      type: object
      additionalProperties: false
      required:
        - requested_start
        - requested_end
        - observed_start
        - observed_end
        - complete
      properties:
        requested_start: {type: string, format: date}
        requested_end: {type: string, format: date}
        observed_start: {type: [string, 'null'], format: date}
        observed_end: {type: [string, 'null'], format: date}
        complete: {type: boolean}
    Lineage:
      type: object
      required:
        - data_selection_id
        - dataset_version_id
        - feature_snapshot_id
        - model_artifact_id
        - serving_assignment_id
        - raw_artifact_id
      properties:
        data_selection_id: {type: string, format: uuid}
        dataset_version_id: {type: string, format: uuid}
        feature_snapshot_id: {type: string, format: uuid}
        model_artifact_id: {type: string, format: uuid}
        serving_assignment_id: {type: string, format: uuid}
        raw_artifact_id: {type: string, format: uuid}
    HealthAssessment:
      type: object
      required: [scope, status, reason_code, affected_attempts]
      properties:
        scope: {type: string}
        status: {type: string, enum: [ready, degraded, blocked, unknown]}
        reason_code: {type: string}
        affected_attempts: {type: integer, minimum: 1}
    SourceCredentialMetadata:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - readiness
        - reason_code
        - secret_ref_id
        - version
        - configured_at
        - last_validated_at
      properties:
        provider_id: {type: string}
        display_name: {type: string}
        credential_kind: {type: string, enum: [api_key_pair, bearer_token]}
        required_fields:
          type: array
          items: {type: string}
        required_uses:
          type: array
          items:
            type: string
            enum: [ingest, retain_observed_history, transform, model, internal_display, backup_restore]
        source_basis: {$ref: '#/components/schemas/ZeroFeeAuthenticatedSourceBasis'}
        readiness:
          type: string
          enum: [missing, configured, valid, validation_failed, expired, revoked]
        reason_code: {type: string}
        secret_ref_id: {type: [string, 'null']}
        version: {type: [integer, 'null'], minimum: 1}
        configured_at: {type: [string, 'null'], format: date-time}
        last_validated_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        validation_evidence:
          oneOf:
            - {$ref: '#/components/schemas/CredentialValidationEvidence'}
            - {type: 'null'}
        secret_cleanup_pending: {type: boolean}
        revoked_at: {type: [string, 'null'], format: date-time}
        registration_url: {type: string, format: uri}
        key_management_url: {type: string, format: uri}
    CredentialValidationEvidence:
      type: object
      additionalProperties: false
      required: [authentication_status]
      properties:
        authentication_status: {type: string, enum: [not_run, passed, failed]}
    SourceContractAssessment:
      type: object
      additionalProperties: false
      required:
        - contract_id
        - live_validation
        - ticker_count
        - pagination_pages
        - datasets
        - symbol_lifecycle_probe
        - universe_manifest_id
        - reference_graph_version_id
        - listing_ids
        - source_contract_reason_code
      properties:
        contract_id: {type: [string, 'null']}
        live_validation: {type: string, enum: [not_run, passed, failed]}
        ticker_count: {type: [integer, 'null'], minimum: 0}
        pagination_pages: {type: [integer, 'null'], minimum: 0}
        datasets:
          type: array
          items: {type: string}
        symbol_lifecycle_probe:
          type: [string, 'null']
          enum: [passed, null]
        universe_manifest_id:
          type: [string, 'null']
          minLength: 1
        reference_graph_version_id:
          type: [string, 'null']
          minLength: 1
        listing_ids:
          type: array
          items: {type: string, format: uuid}
          uniqueItems: true
        source_contract_reason_code:
          type: [string, 'null']
    SourceCredentialValidationResponse:
      type: object
      additionalProperties: false
      required:
        - credential
        - source_contract_assessment
        - source_contract_assessment_artifact_id
      properties:
        credential: {$ref: '#/components/schemas/SourceCredentialMetadata'}
        source_contract_assessment:
          oneOf:
            - {$ref: '#/components/schemas/SourceContractAssessment'}
            - {type: 'null'}
        source_contract_assessment_artifact_id: {type: [string, 'null']}
    SourceCredentialWriteRequest:
      type: object
      additionalProperties: false
      required: [credential_fields]
      properties:
        credential_fields:
          type: object
          minProperties: 1
          maxProperties: 8
          propertyNames:
            minLength: 1
            maxLength: 128
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
            writeOnly: true
        expires_at: {type: [string, 'null'], format: date-time, maxLength: 64}
    ModelGovernanceBacktest:
      type: object
      additionalProperties: false
      required:
        - model_family_id
        - candidate
        - baseline
        - evaluation
        - calibration
        - support
        - gate
        - approval
        - shadow
        - serving
      properties:
        model_family_id: {type: string}
        candidate:
          type: object
          additionalProperties: false
          required: [candidate_id, model_family, artifact_id, formal_qualification]
          properties:
            candidate_id: {type: string}
            model_family: {type: string, const: regularized_multinomial_logistic}
            artifact_id: {type: string}
            formal_qualification: {type: boolean}
        baseline:
          type: object
          additionalProperties: false
          required: [model_family, equal_cell_macro_f1]
          properties:
            model_family: {type: string, const: class_prior}
            equal_cell_macro_f1: {type: number, minimum: 0, maximum: 1}
        evaluation:
          type: object
          additionalProperties: false
          required:
            - evaluation_report_id
            - logistic_equal_cell_macro_f1
            - improvement_percentage_points
          properties:
            evaluation_report_id: {type: string}
            logistic_equal_cell_macro_f1: {type: number, minimum: 0, maximum: 1}
            improvement_percentage_points: {type: number}
        calibration:
          type: object
          additionalProperties: false
          required: [sufficient, required]
          properties:
            sufficient: {type: integer, minimum: 0, maximum: 6}
            required: {type: integer, const: 6}
        support:
          type: object
          additionalProperties: false
          required: [fold_count]
          properties:
            fold_count: {type: integer, minimum: 0}
        gate:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [not_evaluated, passed, failed]}
            policy_version_id: {type: string}
            failed_gates:
              type: array
              items: {type: string}
            hard_gate_evidence_id: {type: [string, 'null']}
            hard_gate_evidence_refs:
              type: array
              items: {type: string}
        approval:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [blocked_by_gate, awaiting_approval, approved, rejected]}
            approval_policy_version_id: {type: [string, 'null']}
            approval_mode: {type: string, enum: [separated_duties, owner_operated]}
            approval_policy_owner_principal_id: {type: [string, 'null']}
            independent_review: {type: boolean}
        shadow:
          type: object
          additionalProperties: false
          required: [eligible_cycle_count, required]
          properties:
            eligible_cycle_count: {type: integer, minimum: 0, maximum: 5}
            required: {type: integer, const: 5}
        serving:
          type: object
          additionalProperties: false
          required: [status, production_assignment_id]
          properties:
            status: {type: string, enum: [blocked, assigned]}
            production_assignment_id: {type: [string, 'null']}
    ApprovalDecisionRequest:
      type: object
