[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-forecasting"
version = "0.1.0"
description = "Traceable Taiwan and United States stock-trend research support"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "dagster>=1.11,<2",
  "dagster-webserver>=1.13,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
stock-forecasting = "stock_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_forecasting = ["fixtures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stock_forecasting"]
